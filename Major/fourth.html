<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alloy Recipe Optimizer</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
}
header {
    text-align: center;
    padding: 20px;
    font-size: 26px;
    font-weight: bold;
}
.container {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 20px;
}
.card {
    background: rgba(255,255,255,0.05);
    padding: 20px;
    border-radius: 15px;
    width: 450px;
}
input {
    width: 80%;
    padding: 6px;
    margin: 5px 0;
}
button {
    padding: 10px;
    margin-top: 10px;
    border: none;
    cursor: pointer;
}
.run { background: #3b82f6; color: white; }
.reset { background: gray; color: white; }

table {
    width: 100%;
    margin-top: 10px;
    border-collapse: collapse;
}
td, th {
    padding: 6px;
    text-align: center;
}
th {
    background: rgba(255,255,255,0.1);
}
.ok { color: #22c55e; }
.bad { color: #ef4444; }
</style>
</head>

<body>

<header>⚙️ Alloy Recipe Optimizer (6061)</header>

<div class="container">

<!-- INPUT -->
<div class="card">
<h3>Inputs</h3>

<label>AA6061-I (Ingot %)</label><br>
<input type="number" id="ingot" value="40"><br>

<h4>Scrap Quantities</h4>
<table>
<tr><td>AARSNNE</td><td><input id="s2" type="number" value="30"></td></tr>
<tr><td>AARSNNE-R</td><td><input id="s3" type="number" value="20"></td></tr>
<tr><td>AAPSNNE</td><td><input id="s4" type="number" value="15"></td></tr>
<tr><td>AAPSNNE-R</td><td><input id="s5" type="number" value="10"></td></tr>
<tr><td>AARSSPL</td><td><input id="s6" type="number" value="5"></td></tr>
<tr><td>AARSSPL-R</td><td><input id="s7" type="number" value="5"></td></tr>
<tr><td>AA6061-IR</td><td><input id="s8" type="number" value="10"></td></tr>
<tr><td>AACAN-R</td><td><input id="s9" type="number" value="5"></td></tr>
</table>

<button class="run" onclick="runCalc()">Run Optimization</button>
<button class="reset" onclick="location.reload()">Reset</button>
</div>

<!-- OUTPUT -->
<div class="card">
<h3>Result</h3>
<div id="result">Click Run</div>
<div id="mixTable"></div>
<div id="chemistryTable"></div>
</div>

</div>

<script>

// ================= DATA =================
const ELEMENTS = ['Si','Fe','Cu','Mn','Mg','Cr','Zn','Ti'];

const TARGET = {
    Si:[0.4,0.8], Fe:[0,1], Cu:[0,0.4], Mn:[0,1],
    Mg:[0.8,1.2], Cr:[0,0.35], Zn:[0,0.25], Ti:[0,0.15]
};

const SCRAP = {
    "AA6061-I": {Si:0.701,Fe:0.843,Cu:0.004,Mn:0.888,Mg:0.954,Cr:0.0009,Zn:0.069,Ti:0.055},
    "AARSNNE": {Si:0.373,Fe:0.205,Cu:0.004,Mn:0.004,Mg:0.344,Cr:0,Zn:0.077,Ti:0.018},
    "AARSNNE-R": {Si:0.339,Fe:0.174,Cu:0.004,Mn:0.006,Mg:0.394,Cr:0,Zn:0.074,Ti:0.013},
    "AAPSNNE": {Si:0.611,Fe:0.164,Cu:0.004,Mn:0.13,Mg:0.811,Cr:0.0002,Zn:0.009,Ti:0.023},
    "AAPSNNE-R": {Si:0.783,Fe:0.136,Cu:0.004,Mn:0.046,Mg:0.771,Cr:0,Zn:0.011,Ti:0.019},
    "AARSSPL": {Si:4.447,Fe:0.075,Cu:0.004,Mn:0.004,Mg:0.317,Cr:0,Zn:0.005,Ti:0.1},
    "AARSSPL-R": {Si:7.576,Fe:0.08,Cu:0.004,Mn:0.004,Mg:0.32,Cr:0.0001,Zn:0.004,Ti:0.098},
    "AA6061-IR": {Si:0.665,Fe:0.832,Cu:0.004,Mn:0.862,Mg:0.962,Cr:0.0008,Zn:0.064,Ti:0.043},
    "AACAN-R": {Si:0.152,Fe:0.417,Cu:0.004,Mn:0.823,Mg:0.979,Cr:0.0009,Zn:0.054,Ti:0.025}
};

// ================= CORE =================

function calcComp(ingot, mix){
    let comp = {};
    ELEMENTS.forEach(e=>comp[e]=0);

    ELEMENTS.forEach(e=>{
        comp[e]+=SCRAP["AA6061-I"][e]*ingot;
        for(let m in mix){
            comp[e]+=SCRAP[m][e]*mix[m];
        }
    });

    return comp;
}

function check(comp){
    let violations=0;
    ELEMENTS.forEach(e=>{
        let [min,max]=TARGET[e];
        if(comp[e]<min || comp[e]>max) violations++;
    });
    return violations;
}

function score(comp){
    let s=0;
    ELEMENTS.forEach(e=>{
        let [min,max]=TARGET[e];
        let center=(min+max)/2;
        let range=max-min||0.1;
        let val=comp[e];

        if(val<min) s+=((min-val)/range*100)**2;
        else if(val>max) s+=((val-max)/range*100)**2;
        else s+=((val-center)/range*10)**2;
    });
    return s;
}

function optimize(ingot, scraps){

    let rem=1-ingot;
    let solutions=[];

    // 1 scrap
    scraps.forEach(s=>{
        let mix={};
        mix[s]=rem;

        let comp=calcComp(ingot,mix);
        solutions.push({mix,comp,v:check(comp),score:score(comp)});
    });

    // 2 scrap
    for(let i=0;i<scraps.length;i++){
        for(let j=i+1;j<scraps.length;j++){
            for(let split=0.1;split<1;split+=0.1){

                let mix={};
                mix[scraps[i]]=rem*split;
                mix[scraps[j]]=rem*(1-split);

                let comp=calcComp(ingot,mix);
                solutions.push({mix,comp,v:check(comp),score:score(comp)});
            }
        }
    }

    solutions.sort((a,b)=>a.v-b.v||a.score-b.score);
    return solutions[0];
}

// ================= MAIN =================

function runCalc(){

    let ingot = parseFloat(document.getElementById("ingot").value)/100;

    let names = [
        "AARSNNE","AARSNNE-R","AAPSNNE","AAPSNNE-R",
        "AARSSPL","AARSSPL-R","AA6061-IR","AACAN-R"
    ];

    let available = names.filter((n,i)=>{
        return parseFloat(document.getElementById("s"+(i+2)).value)>0;
    });

    let best = optimize(ingot, available);

    // ===== MIX TABLE =====
    let mixHTML = `<h3>🏆 Scrap Mix</h3><table><tr><th>Material</th><th>%</th></tr>`;
    mixHTML += `<tr><td>AA6061-I</td><td>${(ingot*100).toFixed(1)}</td></tr>`;

    for(let m in best.mix){
        mixHTML += `<tr><td>${m}</td><td>${(best.mix[m]*100).toFixed(1)}</td></tr>`;
    }
    mixHTML += `</table>`;

    // ===== CHEMISTRY TABLE =====
    let chemHTML = `<h3>🧪 Final Chemistry</h3><table>
    <tr><th>Element</th><th>Value</th><th>Range</th><th>Status</th><th>Adjustment</th></tr>`;

    ELEMENTS.forEach(e=>{
        let val = best.comp[e];
        let [min,max] = TARGET[e];

        let status, cls, adjust;

        if(val < min){
            status = "LOW"; cls="bad";
            adjust = `+${(min-val).toFixed(3)}%`;
        }
        else if(val > max){
            status = "HIGH"; cls="bad";
            adjust = `-${(val-max).toFixed(3)}%`;
        }
        else{
            status = "OK"; cls="ok";
            adjust = "Perfect";
        }

        chemHTML += `
        <tr>
        <td>${e}</td>
        <td>${val.toFixed(3)}</td>
        <td>${min}-${max}</td>
        <td class="${cls}">${status}</td>
        <td>${adjust}</td>
        </tr>`;
    });

    chemHTML += `</table>`;

    document.getElementById("result").innerHTML =
    `✅ Best Solution | Violations: ${best.v}`;

    document.getElementById("mixTable").innerHTML = mixHTML;
    document.getElementById("chemistryTable").innerHTML = chemHTML;
}

</script>

</body>
</html>
