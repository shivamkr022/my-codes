<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alloy Optimization System</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
}

/* HEADER */
header {
    text-align: center;
    padding: 20px;
    font-size: 26px;
    font-weight: bold;
}

/* LAYOUT */
.container {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 20px;
}

/* CARD */
.card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    padding: 20px;
    border-radius: 15px;
    width: 450px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}

/* INPUT */
input {
    width: 85%;
    padding: 8px;
    margin: 5px 0;
    border-radius: 6px;
    border: none;
}

/* TABLE */
table {
    width: 100%;
    margin-top: 10px;
}

td {
    padding: 4px;
}

/* BUTTONS */
button {
    padding: 10px 15px;
    margin-top: 10px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: 0.3s;
}

.run {
    background: #3b82f6;
    color: white;
}

.run:hover {
    background: #2563eb;
    transform: scale(1.05);
}

.reset {
    background: #64748b;
    color: white;
}

.reset:hover {
    background: #475569;
}

/* OUTPUT */
#result {
    margin-top: 10px;
}

.success {
    color: #22c55e;
    font-weight: bold;
}

/* CHART */
canvas {
    margin-top: 20px;
}
</style>
</head>

<body>

<header>
⚙️ Alloy Optimization System
</header>

<div class="container">

<!-- INPUT -->
<div class="card">
<h3>🔹 Inputs</h3>

<label>Batch Size (kg)</label><br>
<input type="number" value="100"><br>

<label>Ingot %</label><br>
<input type="number" id="ingot" value="40"><br>

<h4>Scrap Quantities (kg)</h4>

<table>
<tr><td>AA6061-I</td><td><input type="number" value="50"></td></tr>
<tr><td>AARSNNE</td><td><input type="number" id="s2" value="30"></td></tr>
<tr><td>AARSNNE-R</td><td><input type="number" id="s3" value="20"></td></tr>
<tr><td>AAPSNNE</td><td><input type="number" id="s4" value="15"></td></tr>
<tr><td>AAPSNNE-R</td><td><input type="number" id="s5" value="10"></td></tr>
<tr><td>AARSSPL</td><td><input type="number" id="s6" value="5"></td></tr>
<tr><td>AARSSPL-R</td><td><input type="number" id="s7" value="5"></td></tr>
<tr><td>AA6061-IR</td><td><input type="number" id="s8" value="10"></td></tr>
<tr><td>AACAN-R</td><td><input type="number" id="s9" value="5"></td></tr>
</table>

<button class="run" onclick="runCalc()">Run Optimization</button>
<button class="reset" onclick="location.reload()">Reset</button>

</div>

<!-- OUTPUT -->
<div class="card">
<h3>📊 Output</h3>

<div id="result">Click Run Optimization</div>

<canvas id="chart"></canvas>

</div>

</div>

<script>
let chart;

function runCalc() {

let ingot = parseFloat(document.getElementById("ingot").value);

let scraps = [
    {name:"AARSNNE", val:parseFloat(document.getElementById("s2").value)},
    {name:"AARSNNE-R", val:parseFloat(document.getElementById("s3").value)},
    {name:"AAPSNNE", val:parseFloat(document.getElementById("s4").value)},
    {name:"AAPSNNE-R", val:parseFloat(document.getElementById("s5").value)},
    {name:"AARSSPL", val:parseFloat(document.getElementById("s6").value)},
    {name:"AARSSPL-R", val:parseFloat(document.getElementById("s7").value)},
    {name:"AA6061-IR", val:parseFloat(document.getElementById("s8").value)},
    {name:"AACAN-R", val:parseFloat(document.getElementById("s9").value)}
];

// filter available scraps
let available = scraps.filter(s => s.val > 0);

let remaining = 100 - ingot;
let per = remaining / available.length;

// labels + data
let labels = ["AA6061-I"];
let data = [ingot];

available.forEach(s => {
    labels.push(s.name);
    data.push(per);
});

// 🎨 Professional Colors
let colors = [
    "#3b82f6","#22c55e","#f59e0b","#ef4444",
    "#8b5cf6","#06b6d4","#84cc16","#f97316","#14b8a6"
];

// output text
document.getElementById("result").innerHTML = `
    <p class="success">✅ Feasible (Prototype)</p>
    <p><b>Ingot:</b> ${ingot}%</p>
    <p>Balanced distribution among available scraps</p>
`;

// destroy old chart
if(chart) chart.destroy();

// create chart
chart = new Chart(document.getElementById("chart"), {
    type: 'pie',
    data: {
        labels: labels,
        datasets: [{
            data: data,
            backgroundColor: colors
        }]
    },
    plugins: [ChartDataLabels],
    options: {
        plugins: {
            legend: {
                position: 'bottom',
                labels: {
                    color: "white"
                }
            },
            tooltip: {
                callbacks: {
                    label: function(context) {
                        return context.label + ": " + context.raw + "%";
                    }
                }
            },
            datalabels: {
                color: "white",
                formatter: (value) => value + "%",
                font: {
                    weight: "bold"
                }
            }
        }
    }
});

}
</script>

</body>
</html>
